<title>رياضوبولي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#ffffff;--card:#ffffff;--ink:#1e1b4b;--mut:#6b6b99;--acc:#e11d48;--acc2:#7c3aed;--line:#c7d2fe;--bad:#e11d48;color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#ffffff,#e9e7ff) fixed,var(--bg);color:#1e1b4b;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:28px;margin:14px 0 8px;text-align:center;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);border:3px solid #fff;box-shadow:0 4px 14px rgba(124,58,237,.35);border-radius:14px;padding:8px}
p.sub{text-align:center;color:#5b5b8a;margin:0 0 18px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(180deg,#3b82f6,#2748c9);color:#fff;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.35)}button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
button.alt{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.45;cursor:default}
.menu button{display:block;width:100%;margin:10px 0;padding:18px;font-size:18px}
.menu small{display:block;font-weight:400;opacity:.85;font-size:13px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.chars button{box-shadow:none}.pl{background:rgba(255,255,255,.05);margin:3px 0}
.chars button{padding:8px 2px;font-size:11px;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.chars button b{display:block;font-size:28px}
.chars button.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card))}
.chars button.taken{opacity:.3}
.board{background:#e0e7ff;padding:6px;border-radius:12px;border:4px solid #312e81;box-shadow:0 8px 24px rgba(49,46,129,.3);display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,auto);direction:ltr;gap:3px}
.cell{border:1.5px solid #312e81;background:var(--card);color:#1e1b4b;border-radius:3px;min-height:52px;padding:2px;font-size:9px;line-height:1.15;text-align:center;position:relative;direction:rtl;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cell .own{height:9px;margin:-2px -2px 0;border-bottom:1.5px solid #312e81;background:#ddd}
.cell .nm{font-weight:700}
.cell .pr{color:var(--mut)}
.cell .tk{font-size:12px;line-height:1;word-break:break-all}
.mid{color:#1e1b4b;grid-column:2/7;grid-row:2/7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
.die{font-size:54px;line-height:1}.mid::before{content:"رياضوبولي";background:#e11d48;color:#fff;font-weight:800;padding:4px 10px;border:2px solid #fff;font-size:13px;margin-bottom:8px;transform:rotate(-6deg)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:10px;border:2px solid transparent;font-size:14px}
.pl.on{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 15%,transparent)}
.pl.out{opacity:.4;text-decoration:line-through}
.q{font-size:34px;font-weight:800;direction:ltr;text-align:center;margin:6px 0}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans button{font-size:22px;direction:ltr;background:var(--card);color:var(--ink);border:2px solid var(--line)}
.chars{grid-template-columns:repeat(3,1fr);max-height:62vh;overflow-y:auto;padding:4px}.chars button{background:#e8edff;border-radius:16px;border-color:#a5b4fc;color:#1e1b4b;font-size:13px;font-weight:700}.chars button.sel,.chars button:hover{border-color:var(--acc)}svg.av{width:1.3em;height:1.6em;vertical-align:-.3em}.chars button b svg{width:76px;height:91px}.cell .tk svg.av{width:14px;height:17px;vertical-align:baseline}.pl svg.av{width:20px;height:24px}
.zs{display:grid;gap:6px;margin:8px 0}.zone{background:#fff;border:3px solid;border-radius:14px;padding:6px;min-height:84px;font-size:12px}.zone.on{box-shadow:0 0 0 3px #7c3aed,0 6px 16px rgba(124,58,237,.35)}.zone.out{opacity:.4}.zh{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-weight:700}.zh svg.av{width:22px;height:26px}.zh em{font-style:normal;font-weight:800;margin-inline-start:auto}.cs{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}.cs small{color:var(--mut)}.pc{width:68px;border:1px solid #312e81;border-radius:6px;background:#fff;font-size:10px;text-align:center;overflow:hidden;line-height:1.3;padding-bottom:2px}.pc u{display:block;text-decoration:none;color:#15803d;font-weight:800}.pc i{display:block;height:8px}.pc b{display:block;padding:0 1px}.pc s{text-decoration:none;color:var(--mut)}
body{background-image:radial-gradient(circle at 15% 10%,rgba(124,58,237,.12) 0 90px,transparent 91px),radial-gradient(circle at 90% 30%,rgba(225,29,72,.10) 0 70px,transparent 71px),radial-gradient(circle at 10% 85%,rgba(37,99,235,.12) 0 110px,transparent 111px),linear-gradient(180deg,#fff,#e9e7ff);background-attachment:fixed}
.card,.zone{box-shadow:0 6px 18px rgba(49,46,129,.15)}
.board{background:linear-gradient(135deg,#dbe4ff,#ede9fe);margin:10px 0;box-shadow:0 0 0 3px #7c3aed,0 0 0 6px #fff,0 14px 30px rgba(49,46,129,.35)}
.cell{background:linear-gradient(180deg,#fff,#f1f2ff);box-shadow:0 1px 3px rgba(0,0,0,.2);border-radius:5px}
.cell.sp-s{background:linear-gradient(180deg,#d1fae5,#86efac)}.cell.sp-c{background:linear-gradient(180deg,#ffedd5,#fdba74)}.cell.sp-x{background:linear-gradient(180deg,#fee2e2,#fca5a5)}.cell.sp-f{background:linear-gradient(180deg,#e0f2fe,#7dd3fc)}
.cell .pr{font-weight:700;color:#4338ca;font-size:10px}.cell.sp-c .pr{font-size:18px}
.mid{background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 10px,rgba(199,210,254,.55) 10px 20px);border-radius:10px;border:2px dashed #a5b4fc}
.mid::before{box-shadow:0 4px 0 #9f1239;font-size:15px;border-radius:4px}
.cell .tk svg.av{filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.zone{background:linear-gradient(180deg,#fff,#f5f3ff)}
.zh svg.av{width:30px;height:32px;background:#e0e7ff;border-radius:50%;border:2px solid #c7d2fe}
.pc{box-shadow:0 2px 4px rgba(0,0,0,.25)}.pc i{height:11px}
.dice{width:58px;height:58px;background:#fff;border-radius:13px;border:2px solid #e0e3f5;box-shadow:0 4px 0 #c7cbe8,0 10px 16px rgba(0,0,0,.25);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;animation:tumble .5s}
.dice i{width:11px;height:11px;border-radius:50%;background:#e11d48;align-self:center;justify-self:center}
@keyframes tumble{from{transform:rotate(-220deg) scale(.4)}to{transform:none}}
.msg{background:#fff;border-radius:12px;padding:10px;box-shadow:0 4px 12px rgba(49,46,129,.15);margin:8px 0;color:#1e1b4b}.msg:empty{visibility:hidden}
.chars button{box-shadow:0 4px 10px rgba(49,46,129,.18)}.chars button:hover{transform:translateY(-2px)}
.menu button.alt:nth-child(2){background:linear-gradient(180deg,#8b5cf6,#6d28d9);color:#fff;border:0}
.menu button{border-radius:16px}

.msg{animation:pop .4s}.msg.still{animation:none}.zone.on .zh svg.av{animation:hop .8s infinite}

.msg{min-height:44px;text-align:center;font-weight:600}
.ok{color:var(--acc)}.no{color:var(--bad)}

.burst span{position:absolute;font-size:30px;animation:bs 1.6s ease-out both}

.av{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}.chars button:hover .av{animation:hop .6s infinite}

.cell .tk{font-size:15px}.cell:hover{transform:scale(1.04)}
button{transition:transform .1s,filter .2s}button:hover{filter:brightness(1.12)}

.code{font-size:44px;letter-spacing:10px;direction:ltr;text-align:center;font-weight:800;color:#7c3aed;background:#fff;border:3px dashed #7c3aed;border-radius:14px;padding:6px;margin:8px 0}
.ci{width:100%;padding:14px;font:inherit;font-size:30px;text-align:center;letter-spacing:10px;direction:ltr;border:3px solid #a5b4fc;border-radius:12px;color:#1e1b4b;text-transform:uppercase}

.av .bob{animation:bob 2s ease-in-out infinite;animation-delay:var(--d)}@keyframes bob{50%{transform:translateY(-2px)}}
.av .aL{animation:wvl 1.5s ease-in-out infinite;animation-delay:var(--d)}.av .aR{animation:wvr 1.5s ease-in-out infinite;animation-delay:var(--d)}

.av .bl{animation:bl 3.6s infinite;animation-delay:var(--d)}@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.av .lk{animation:lk 5s ease-in-out infinite;animation-delay:var(--d)}@keyframes lk{25%{transform:translateX(1.8px)}75%{transform:translateX(-1.8px)}}
.av .mo{animation:mo 2.4s ease-in-out infinite;animation-delay:var(--d)}@keyframes mo{50%{transform:scaleY(.6)}}
.av .er{animation:er 3.2s linear infinite}@keyframes er{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-100px);opacity:0}}
.av .ef{animation:ef 3.6s linear infinite}@keyframes ef{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(100px);opacity:0}}
.av .tw{animation:tw 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}

@media (prefers-reduced-motion:reduce){.av *{animation:none!important}}

function onGo(m){var L=m.data&&m.data.L;if(!Array.isArray(L)||!RM)return;var hp=RM.peers().find(function(p){return p.presence&&p.presence.host});if(!hp||hp.peer!=m.peer)return;var me=RM.peers().find(function(p){return p.isMe&&p.sameTab});
S={mode:"net",n:L.length,pl:L.slice(0,8).map(function(x){return{ch:Math.max(0,Math.min(CH.length-1,x.ch|0)),money:1500,pos:0,out:false,bot:false,peer:x.peer,name:esc(x.name)||"لاعب"}}),owner:T.map(function(){return-1}),cur:0,busy:false};
ME=S.pl.findIndex(function(p){return me&&p.peer==me.peer});if(ME<0){alert("الغرفة ممتلئة");return home()}NE=(ME==0);turnStart()}

function mqRoom(code){return new Promise(function(res,rej){
var id=Math.random().toString(36).slice(2,10),base="riyadobooli/"+code+"/",L={},PL=[],pres={},peers={},me={peer:id,isMe:true,sameTab:true,presence:pres},c=mqtt.connect("wss://broker.hivemq.com:8884/mqtt",{reconnectPeriod:2000}),to=setTimeout(function(){rej(0);c.end(true)},10000);
function plist(){var n=Date.now();Object.keys(peers).forEach(function(k){if(n-peers[k].t>8000)delete peers[k]});return[me].concat(Object.keys(peers).map(function(k){return peers[k].p}))}
function fire(){PL.forEach(function(f){f({peers:plist()})})}

var iv=null;
c.on("error",function(){});
c.on("connect",function(){c.subscribe(base+"#",function(){clearTimeout(to);if(iv)return;
var R={peers:plist,emit:function(t,d){c.publish(base+"e/"+t,JSON.stringify({f:id,d:d}));return Promise.resolve()},on:function(t,f){(L[t]=L[t]||[]).push(f);return function(){}},onPeers:function(f){PL.push(f);return function(){}},presence:function(p){for(var k in p)pres[k]=p[k];ann();return Promise.resolve()},leave:function(){clearInterval(iv);try{c.publish(base+"p",JSON.stringify({f:id,x:1}));c.end(true)}catch(e){}return Promise.resolve()}};
iv=setInterval(ann,2500);
c.on("message",function(tp,buf){var m;try{m=JSON.parse(buf.toString())}catch(e){return}if(!m||typeof m.f!="string")return;var ev=tp.indexOf(base+"e/")==0;
if(!ev){if(m.f===id)return;if(m.x)delete peers[m.f];else if(m.p&&typeof m.p=="object"){var nw=!peers[m.f];peers[m.f]={t:Date.now(),p:{peer:m.f,isMe:false,sameTab:false,presence:m.p}};if(nw)ann()}fire();return}
var t=tp.slice((base+"e/").length);(L[t]||[]).forEach(function(f){f({topic:t,data:m.d,peer:m.f,isMe:m.f===id,sameTab:m.f===id})})});
res(R);ann()})})})}
