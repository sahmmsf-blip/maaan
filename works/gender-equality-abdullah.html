<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان واحد للجميع | رحلة تفاعلية</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<style>
:root{--g:linear-gradient(135deg,#7c3aed,#db2777);--ink:#fff;--bg:#1e1b4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d2a}}
:root[data-theme="dark"]{--bg:#0f0d2a}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;background:var(--g);transition:background .6s}
#em{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#em span{position:absolute;bottom:-60px;animation:fl linear infinite;opacity:.35}
@keyframes fl{to{transform:translateY(-120vh) rotate(360deg)}}
#top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:flex;gap:8px;align-items:center;padding:8px 12px;background:rgba(0,0,0,.25);backdrop-filter:blur(8px)}
#top b{font-weight:900;font-size:15px;white-space:nowrap}
select{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px;border-radius:10px;border:0;background:#fff;color:#1e1b4b}
#pg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 48px);left:0;right:0;height:4px;background:rgba(255,255,255,.2);z-index:5}
#pb{height:100%;background:#fde047;transition:width .4s}
#st{position:fixed;inset:0;top:calc(env(safe-area-inset-top,0px) + 52px);bottom:calc(64px + env(safe-area-inset-bottom,0px));overflow:hidden}
.s{position:absolute;inset:0;overflow-y:auto;padding:18px 16px;display:none;text-align:center}
.s.on{display:block;animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.w{max-width:620px;margin:0 auto}
h1{font-size:38px;font-weight:900;margin:8px 0;line-height:1.25}
h2{font-size:26px;font-weight:900;margin:6px 0 8px;line-height:1.35}
em{color:#fde047;font-style:normal}
.k{display:inline-block;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:99px;font-size:13px;font-weight:700}
p{font-size:16px;line-height:1.8;margin:8px 0}
.big{font-size:80px;animation:bn 2s ease-in-out infinite}
@keyframes bn{50%{transform:translateY(-12px) scale(1.08)}}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.c{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:18px;padding:12px;color:inherit;font:inherit;text-align:center;cursor:pointer;transition:.2s}
.c:hover,.c.a{background:rgba(255,255,255,.34);transform:translateY(-3px)}
.c i{display:block;font-style:normal;font-size:34px}.c b{display:block;font-size:16px}.c p{font-size:13px;margin:4px 0 0}
.out{background:#fff;color:#1e1b4b;border-radius:16px;padding:12px;min-height:60px;font-weight:700;font-size:15px;line-height:1.7;margin:8px 0}
.tip{background:rgba(0,0,0,.25);border-radius:16px;padding:10px 14px;font-size:15px;margin:12px 0}
.btn{background:#fde047;color:#1e1b4b;border:0;border-radius:99px;padding:12px 26px;font:inherit;font-weight:900;font-size:17px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px)}
.num{font-size:64px;font-weight:900;color:#fde047;line-height:1.1}
.bar{text-align:right;font-size:13px;font-weight:700;margin:8px 0}
.bar div{height:16px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin-top:3px}
.bar div i{display:block;height:100%;width:0;background:#fde047;border-radius:9px;transition:width 1.2s}
.hid{display:none}
#nv{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.3);backdrop-filter:blur(8px)}
#nv button{background:#fff;color:#1e1b4b;border:0;border-radius:99px;width:46px;height:46px;font-size:22px;font-weight:900;cursor:pointer}
#nv button:disabled{opacity:.35}
</style></head><body>
<div id="bg"></div><div id="em"></div>
<div id="top"><b>⚖️ ميزان واحد</b><select id="sel" aria-label="انتقل إلى صفحة"></select></div>
<div id="pg"><div id="pb"></div></div>
<div id="st"></div>

<script>
var C=function(e,t,d,a,b){var x=b||a;return '<button class="c"'+(x?' data-x="'+x+'"':'')+'><i>'+e+'</i><b>'+t+'</b>'+(d?'<p>'+d+'</p>':'')+'</button>'};
var QA=[["الفتاة والفتى يملكان القدرة نفسها على النجاح في الدراسة إذا حصلا على الدعم نفسه.",1,"صحيح. الفرق غالباً في الفرصة والتشجيع وليس في القدرة."],["من الطبيعي أن تُمنع الفتاة من متابعة تعليمها لأنها ستتزوج.",0,"خطأ. التعليم حق لكل فتاة، وهو يفيدها وأسرتها ومجتمعها."],["الصور النمطية قد تؤذي الفتيان أيضاً، مثل منعهم من التعبير عن مشاعرهم.",1,"صحيح. القوالب الجاهزة تحدّ من حرية الجميع."],["النوع الاجتماعي يعني الفروق البيولوجية بين الذكر والأنثى.",0,"خطأ. هذا تعريف الجنس. أما النوع الاجتماعي فهو الأدوار التي يحددها المجتمع."],["الاختلاف بين الجنسين يبرر أن يكون لأحدهما حقوق أقل.",0,"خطأ. الاختلاف لا يبرر الحرمان من الحقوق."]];
var QB=[["الأردن حقق تقارباً كبيراً بين الفتيات والفتيان في التعليم، لكن الفجوة أكبر في سوق العمل.",1,"صحيح. وهذا ما يسمى «فجوة التحويل»: التعليم لا يتحول دائماً إلى وظيفة."],["ضعف المواصلات قد يكون عائقاً أمام عمل المرأة.",1,"صحيح. المواصلات الآمنة والمناسبة عامل مهم في قرار العمل."],["عمل المرأة في البيت دون أجر ليس عملاً حقيقياً.",0,"خطأ. الرعاية والأعمال المنزلية عمل حقيقي يوفر على الأسرة والاقتصاد."],["القوانين وحدها تكفي لتحقيق المساواة دون تغيير في الأفكار.",0,"خطأ. نحتاج تطبيق القوانين وتغيير النظرة المجتمعية معاً."],["مشاركة الأب في رعاية الأبناء تساعد الأم على الدراسة والعمل.",1,"صحيح. المشاركة تعطي كل فرد وقتاً وفرصة."]];
var S=[
["البداية",'<div class="big">⚖️</div><span class="k">مشروع توعوي تفاعلي</span><h1>ميزان واحد <em>للجميع</em></h1><p>كل فتاة وكل فتى يستحقان الفرصة نفسها ليحلما ويتعلما ويقودا.</p><p>لكن هل الميزان متساوٍ فعلاً؟ تعال نكتشف، ونقف عند حال الأردن.</p><button class="btn" onclick="go(1)">ابدأ الرحلة ←</button><p style="font-size:13px;opacity:.8">رحلة من 20 محطة • اسحب أو استخدم الأسهم</p>','linear-gradient(135deg,#7c3aed,#db2777)'],
["ما المقصود؟",'<span class="k">01 / نفهم القضية</span><h2>ما هي عدم المساواة في <em>النوع الاجتماعي؟</em></h2><p>هي أن يُعامَل الناس بشكل مختلف أو غير عادل فقط لأنهم إناث أو ذكور. وتظهر في الفرص والحقوق والاحترام ومن يتخذ القرار.</p><div class="gr">'+C("🚪","فرص أقل","","قد تُغلق أبواب التعليم أو العمل أمام أحد الجنسين.")+C("🗣️","صوت أضعف","","رأي لا يُسمع أو لا يؤخذ بجدية بنفس القدر.")+C("⚖️","حقوق متفاوتة","","اختلاف في الأجر والملكية والمشاركة في القرار.")+'</div><div class="out">👆 اضغط على بطاقة</div><div class="tip">💡 المشكلة ليست في الاختلاف نفسه، بل في أن يُحرَم أحد من فرصة بسببه.</div>','linear-gradient(135deg,#2563eb,#7c3aed)'],
["الجنس والنوع",'<span class="k">02 / مصطلحات مهمة</span><h2>الجنس <em>≠</em> النوع الاجتماعي</h2><p>كثيرون يخلطون بين الكلمتين، لكن بينهما فرقاً مهماً. اضغط على كل بطاقة.</p><div class="gr">'+C("🧬","الجنس","","","الجنس: الفروق البيولوجية بين الذكر والأنثى. نولد بها ولا نختارها.")+C("🎭","النوع الاجتماعي","","","النوع الاجتماعي: الأدوار والتوقعات التي يضعها المجتمع، مثل «هذا شغل بنات وهذا شغل أولاد». وهذه تتغير مع الزمن ومن مجتمع لآخر.")+'</div><div class="out">👆 اختر بطاقة</div><div class="tip">💡 لأن الأدوار صنعها المجتمع، نستطيع نحن أن نغيّرها نحو الأفضل.</div>','linear-gradient(135deg,#0ea5e9,#2563eb)'],
["أين تظهر؟",'<span class="k">03 / نبحث عن الأمثلة</span><h2>أين تظهر <em>الفجوة؟</em></h2><p>قد لا نلاحظها لأنها اعتدنا عليها. اضغط على كل مجال.</p><div class="gr">'+C("🏫","التعليم","","","قد تُشجَّع الفتيات والفتيان على تخصصات معينة فقط، وقد يُمنع بعضهم من إكمال الدراسة لأسباب مرتبطة بالجنس.")+C("💼","العمل","","","فرص أقل في بعض الوظائف، وصعوبة في الترقي إلى مناصب عليا، وأحياناً أجر أقل لعمل مشابه.")+C("🏛️","القرار","","","عندما يغيب أحد الجنسين عن مواقع القرار، لا تُسمع احتياجاته كاملة.")+C("🏠","البيت","","","توزيع غير عادل للأعمال المنزلية ورعاية الأطفال.")+C("🛡️","الأمان","","","التحرش والتنمر يجعلان بعض الناس يتجنبون الدراسة أو العمل أو التنقل.")+C("🩺","الصحة","","","أحياناً لا تُعطى احتياجات الفتيات أو الفتيان الصحية والنفسية الاهتمام الكافي.")+'</div><div class="out">👆 اضغط على مجال</div>','linear-gradient(135deg,#059669,#0ea5e9)'],
["حكاية ليلى",'<span class="k">04 / تخيّل الموقف</span><h2>حكاية <em>ليلى وسامر</em></h2><p>🧒🏻 ليلى وأخوها سامر متفوقان في العلوم، ويحلم كلاهما بدراسة الهندسة.</p><p>🏠 في آخر السنة قالت العائلة: «سامر يكمل دراسته، وليلى تبقى تساعد في البيت».</p><p>😔 ليلى ما زالت تحلم بأن تصبح مهندسة، لكنها لا تعرف كيف.</p><button class="btn rv">برأيك: هل ليلى أقل قدرة من سامر؟</button><div class="out hid">لا! ليلى قادرة تماماً مثل سامر. الفرق في الفرصة وليس في القدرة. وعندما نعطي الجميع فرصة عادلة، تربح الأسرة والمجتمع كله من مواهبهم.</div>','linear-gradient(135deg,#f59e0b,#e11d48)'],
["خرافات",'<span class="k">05 / حقيقة أم خرافة؟</span><h2>نكسر <em>الصور النمطية</em></h2><p>الصورة النمطية فكرة جاهزة نطبقها على كل شخص من جنس معين. اضغط لتكشف الحقيقة.</p><div class="gr">'+C("🙅‍♀️","«البنات ضعيفات في الرياضيات»","","","خرافة: القدرات تتقارب، والاختلاف غالباً في التشجيع والفرص.")+C("🙅‍♂️","«الرجال لا يبكون»","","","خرافة: التعبير عن المشاعر صحة نفسية وليس ضعفاً.")+C("🙅","«القيادة للرجال فقط»","","","خرافة: القيادة مهارة يتعلمها كل من يتدرب عليها.")+C("🙅‍♀️","«مكان المرأة البيت فقط»","","","خرافة: لكل إنسان حق اختيار طريقه ومكانه.")+'</div><div class="out">👆 اختر عبارة</div>','linear-gradient(135deg,#9333ea,#4f46e5)'],
["اختبار 1",'<span class="k">06 / دوركم الآن</span><h2>اختبر معلوماتك! <em>صح أم خطأ؟</em></h2><div id="qz1"></div>','linear-gradient(135deg,#c026d3,#f59e0b)'],
["الأردن: الصورة العامة",'<span class="k">07 / ننتقل إلى الأردن</span><h2>🇯🇴 كيف حال <em>الميزان في الأردن؟</em></h2><p>أظهر تقرير الفجوة بين الجنسين لعام 2025 أن الأردن جاء في المرتبة 122 من 148 دولة.</p><div class="num">122 / 148</div><p>لكن الصورة ليست كلها سلبية. هناك تقدم واضح، وهناك تحديات ما زالت قائمة.</p><div class="gr">'+C("✅","نقاط قوة","","","التعليم والصحة قريبان من التكافؤ بين الجنسين.")+C("⚠️","تحديات","","","المشاركة الاقتصادية والتمثيل السياسي ما زالا أقل من المطلوب.")+'</div><div class="out">👆 اضغط على بطاقة</div><p style="font-size:13px">المصدر: المنتدى الاقتصادي العالمي (2025).</p>','linear-gradient(135deg,#dc2626,#7c3aed)'],
["التعليم والعمل",'<span class="k">08 / فجوة التحويل</span><h2>تتعلم… لكن أين <em>الوظيفة؟</em></h2><p>في الأردن تتفوق الفتيات في التعليم كثيراً، وتلتحق أعداد كبيرة منهن بالجامعات. لكن هذا التعليم لا يتحول دائماً إلى فرصة عمل.</p><div class="num">14.9%</div><p>هي نسبة مشاركة النساء في سوق العمل عام 2024، وتُعد من الأدنى في المنطقة.</p><div class="tip">🎓 يسمي الباحثون هذا «فجوة التحويل»: كفاءة موجودة، لكن فرص أقل لاستثمارها.</div><p style="font-size:13px">المصدر: ورقة المنتدى الاقتصادي الأردني (2025).</p>','linear-gradient(135deg,#ea580c,#db2777)'],
["الأجور والمناصب",'<span class="k">09 / داخل مكان العمل</span><h2>الأجر <em>والترقية</em></h2><p>حتى عندما تعمل المرأة، قد تواجه فجوة في الأجر وصعوبة في الوصول إلى المناصب العليا.</p><div class="num">17–21%</div><p>هي فجوة الأجور التقديرية بين الجنسين في الأردن بحسب الورقة نفسها.</p><div class="gr">'+C("💵","أجر مساوٍ","","","عمل متساوٍ وكفاءة متساوية يستحقان أجراً متساوياً.")+C("📈","ترقية عادلة","","","الترقية تكون حسب الجهد والمهارة وليس الجنس.")+'</div><div class="out">👆 اضغط على بطاقة</div>','linear-gradient(135deg,#be123c,#7c2d12)'],
["المشاركة السياسية",'<span class="k">10 / صوت المرأة</span><h2>من <em>يتخذ القرار؟</em></h2><p>عندما تشارك النساء في الأحزاب والمجالس، تصل احتياجات الأسر إلى طاولة القرار بشكل أفضل. وقد اتخذ الأردن خطوات تشريعية لزيادة تمثيل النساء، منها الكوتا النسائية في مجلس النواب.</p><div class="num">44%</div><p>هي نسبة مشاركة النساء في عضوية الأحزاب السياسية عام 2025 بحسب المنتدى الاقتصادي الأردني.</p><div class="tip">💡 التحدي الآن: أن تتحول المشاركة في الأحزاب إلى مقاعد ومناصب قرار حقيقية.</div>','linear-gradient(135deg,#4338ca,#0891b2)'],
["ما العوائق؟",'<span class="k">11 / لماذا تتأخر الفرص؟</span><h2>ما الذي <em>يعيق المرأة؟</em></h2><p>تشير التحليلات إلى عوامل متداخلة. اضغط على كل عامل.</p><div class="gr">'+C("🚌","المواصلات","","","ضعف المواصلات الآمنة والمنتظمة يجعل الذهاب للعمل مكلفاً أو صعباً.")+C("👨‍👩‍👧","نموذج «المعيل الذكر»","","","الفكرة أن الرجل وحده يعمل وينفق، فتقل فرص المرأة في العمل.")+C("🗣️","نظرة المجتمع","","","بعض الأعمال تُعتبر «غير مناسبة» للنساء، فتضيق الخيارات.")+C("🏢","تنوع وظائف القطاع الخاص","","","محدودية الفرص والمرونة تصعّب الجمع بين العمل والأسرة.")+'</div><div class="out">👆 اختر عاملاً</div>','linear-gradient(135deg,#0f766e,#2563eb)'],
["في البيت",'<span class="k">12 / داخل البيت</span><h2>العمل <em>غير المرئي</em></h2><p>الطبخ والتنظيف ورعاية الأطفال وكبار السن عمل حقيقي ومرهق، لكنه غير مدفوع ولا يظهر في أي إحصاء، وغالباً تتحمله النساء أكثر.</p><div class="gr">'+C("🍳","نتشارك","","","عندما يتشارك الجميع، يصبح لكل فرد وقت للدراسة والعمل والراحة.")+C("👶","نرعى معاً","","","الأبوة والأمومة مسؤولية مشتركة.")+C("🧹","نوزّع بعدل","","","الأعمال تُقسَّم حسب الوقت والقدرة وليس حسب الجنس.")+'</div><div class="out">👆 اضغط لتعرف</div>','linear-gradient(135deg,#16a34a,#0d9488)'],
["حكاية عمر",'<span class="k">13 / الأولاد أيضاً</span><h2>حكاية <em>عمر</em></h2><p>👦 عمر يحب الطبخ والرسم، ويحلم أن يصبح طاهياً ماهراً.</p><p>😕 زملاؤه يقولون له: «هذا شغل بنات!» فيشعر بالخجل ويخفي موهبته.</p><button class="btn rv">برأيك: هل الصور النمطية تؤذي الأولاد أيضاً؟</button><div class="out hid">نعم! الصور النمطية تقيّد الجميع. أشهر الطهاة في العالم رجال كثيرون، والموهبة لا جنس لها. المساواة تحرر الفتيات والفتيان معاً.</div>','linear-gradient(135deg,#f43f5e,#a855f7)'],
